categories:
  - trasporti

conversations:
  - - La scuola è ben collegata?
    - Sì, ci sono pullman ben distribuiti che collegano la scuola a tutti i paesi limitrofi.

  - - Ci sono autobus per il mio paese?
    - Sì, la scuola è servita da diverse linee e copre la maggior parte dei comuni del territorio.

  - - A che ora partono i pullman dopo le lezioni?
    - Le partenze sono organizzate in base all’orario scolastico, con più corse disponibili per facilitare il rientro.

  - - Chi posso contattare per informazioni sui trasporti?
    - Puoi rivolgerti alla segreteria o consultare la bacheca dei trasporti aggiornata.

  - - Ci sono variazioni durante l’anno?
    - Eventuali variazioni vengono comunicate tempestivamente tramite circolari e canali scolastici.

  - - Gli studenti del Tecnico Trasporti e Logistica fanno attività esterne?
    - Sì, sono previste esercitazioni presso il porto, il simulatore di navigazione e l’aula nautica a Marinagri.
