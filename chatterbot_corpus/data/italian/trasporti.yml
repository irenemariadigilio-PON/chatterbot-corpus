categories:
  - trasporti

conversations:
  - - La scuola è ben collegata?
    - Sì, ci sono pullman ben distribuiti che collegano la scuola a tutti i paesi limitrofi.
    - La nostra scuola è ben collegata a tutti i paesi limitrofi, e grazie alla vicinanza della nostra scuola dalle fermate non ti sarà difficile spostarti!
  - - Ci sono autobus per il mio paese?
    - Sì, la scuola è servita da diverse linee e copre la maggior parte dei comuni del territorio.
    - Sicuramente! Ti consiglio di visionare le tabelle dei pullman di linea del tuo paese, li troverai tutti gli orari per confrontarli con quelli della nostra scuola.
  - - A che ora partono i pullman dopo le lezioni?
    - Le partenze sono organizzate in base all’orario scolastico, con più corse disponibili per facilitare il rientro.
    - Dopo le lezioni ci sono diversi pullman distribuiti in fasce orarie apposite per gli alunni che hanno un orario diverso dagli altri, ad esempio per i nostri alunni che terminano le lezioni alle 14:00 o ancora i nostri alunni che fanno rientri pomeridiani.
  - - Chi posso contattare per informazioni sui trasporti?
    - Puoi rivolgerti alla segreteria o consultare la bacheca dei trasporti aggiornata.
    - Per maggiorni informazioni puoi rivolgerti alla nostra segreteria o visionare le tabelle dei pullman di linea.
  - - Ci sono variazioni durante l’anno?
    - Eventuali variazioni vengono comunicate tempestivamente tramite circolari e canali scolastici.
    - Eventuali variazioni dei traasporti ti saranno comunicate sia dalla compagnia che dalla nostra segreteria scolastica.
  - - Gli studenti del Tecnico Trasporti e Logistica fanno attività esterne?
    - Sì, sono previste esercitazioni presso il porto, il simulatore di navigazione e l’aula nautica a Marinagri.
    - Per i nostri alunni frequentanti il tecnico Trasporti e Logistica sono programmate varie uscite. I trasporti non sono un problema in quanto è la scuola a organizzarle e ad assumersene la completa responsabilità.
