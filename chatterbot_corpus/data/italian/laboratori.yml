categories:
  - laboratori

conversations:
  - - Quali laboratori sono presenti nella scuola?
    - La scuola dispone di numerosi laboratori! Innovazione, linguistico, informatico, fisica, chimica, disegno tecnico e un’aula dedicata alla banda musicale.

  - - Che cosa si fa nel laboratorio dell’innovazione?
    - È uno spazio dedicato a progetti digitali, tecnologie emergenti e attività creative orientate alla sperimentazione e alla transizione digitale.

  - - Come funziona il laboratorio linguistico?
    - È un’aula attrezzata con postazioni audio e software linguistici, usata per esercitazioni di ascolto, conversazione e attività con docenti madrelingua.

  - - A cosa serve il laboratorio informatico?
    - Si usa per attività di coding, progettazione, simulazioni, ricerche, lezioni digitali e sperimentazioni legate alle materie scientifiche e tecnologiche.

  - - Cosa si svolge nel laboratorio di fisica?
    - Qui si eseguono esperimenti e dimostrazioni pratiche sui fenomeni fisici studiati in classe.

  - - Com’è strutturato il laboratorio di chimica?
    - È dotato di strumentazioni e postazioni sicure per esperimenti, analisi e attività pratiche sulle reazioni chimiche e sui materiali.

  - - Cosa si fa nel laboratorio di disegno tecnico?
    - Si lavora su progettazione, grafica tecnica, strumenti di disegno e software dedicati, soprattutto per gli indirizzi scientifici e tecnici.

  - - La scuola ha un’aula per la banda musicale?
    - Sì, esiste un’aula attrezzata con strumenti musicali dove la banda scolastica si esercita e prepara esibizioni ed eventi.

  - - Posso visitare i laboratori?
    - Sì, durante gli open day o su richiesta la scuola organizza visite guidate ai vari laboratori.
 
 


