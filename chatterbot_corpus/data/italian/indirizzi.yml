categories:
- indirizzi
conversations:
- - Quali indirizzi ci sono?
  - Ci sono diversi indirizzi! Lo scientifico, il tecnologico, il nautico, il linguistico, il classico e l'artistico.
  - La nostra scuola offre diversi indirizzi, abbiamo indirizzi scientifici come il tecnologico e lo scientifico tradizionale, indirizzi umanistici come classico e artistico, e istituti tecnici come trasporti e logistica o il nostro indirizzo di navigazione.
- - Quale indirizzo mi consigli?
  - Non posso consigliarti un indirizzo preciso, posso solo descriverti le diverse scelte che hai a disposizione e darti tutte le info di cui hai bisogno.
  - Questo dipende dalle tue passioni e da ciò che ti piace, io posso solo aiutarti a conoscere bene le scelte che hai a disposizione!
- - Dove posso trovare il quadro orario?
  - Prova a richiedere alla segreteria il quadro orario, sapranno darti tutte le risposte che cerchi. Le info di contatto le puoi trovare sul nostro sito (https://www.enricofermipolicoro.it/)
  - Per il quadro orario puoi richiederlo alla nostra segreteria o agli studenti che ti accoglieranno nella nostra scuola durante gli open day!
- - Come cambiano le materie in base agli indirizzi?
  - Alcuni indirizzi sono molto differenti tra di loro, dipende proprio da questo! Il linguistico ha come materie principali le lingue straniere (inglese, francese e tedesco); lo scientifico offre una formazione completa e in più dovrai studiare il latino; il tecnologico invece, in sostituzione al latino, ha l'informatica e così via. Tutti i chiarimenti sono sulla brochure illustrativa dei singoli indirizzi!
- - A me piacciono molto le materie umanistiche, che scuola mi consigli?
  - In base alle tue preferenze la risposta più logica è il liceo classico, ma non sottovalutare nemmeno il lioceo scientifico, è pur sempre un liceo, ti offre una formazione a 360*
- - Se volessi più informazioni per un indirizzo specifico, a chi posso rivolgermi?
  - Ti consiglio di rimanere attivo sui nostri profili social, lì troverai tutte le date per i nostri open-day, ci saranno alunni e professori pronti a darti i chiarimenti di chui hai bisogno!
- - Ci sono indirizzi quadriennali?
  - Certo!! Hai la possibilità di iscriverti al nostro indirizzo quadriennale, il TrED (liceo della Transizione Ecologica e Digitale)
