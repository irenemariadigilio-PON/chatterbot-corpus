conversations:
  - - Che corsi opzionali offre la scuola?
    - Nella nostra scuola sono disponibili corsi come il digital service, le romanae disputationes, le micro conferenze, i corsi di atletica, ballo, teatro e altri laboratori tematici.
    - La nostra scuola offre un ampia scelta, abbiamo diversi tipi di corsi che ogni alunno può frequentare in maniera facoltativa. Attività sportive, corsi di formazione in materie scientifiche, corsi di preparazione B1 e B2 e molto altro. Sul nostro sito potrai trovare tutte le info che cerchi!
    - La nostra scuola offre diversi corsi extracurriculari, offre una vasta scelta in base alle tue passioni e ai tuoi hobby. Ci sono attività sportive, attività artistiche e vari corsi di formazione sia a livello linguistico che a livello informatico. Inoltre potrai seguire corsi di chimica e matematica e potrai partecipare anche a gare studentesche, anche a livello nazionale!
  - - Posso ottenere certificazioni linguistiche?
    - Sì, la scuola offre preparazione alle certificazioni B1 e B2 ed è una sede di esame dove puoi conseguire le certificazioni.
  - - È possibile conseguire certificazioni informatiche?
    - Sì, nella nostra scuola avrai la possibilità di conseguire la certificazione EIPASS.
  - - Cosa sono le micro conferenze?
    - Le microconferenze sono incontri brevi e tematici tenuti da docenti o esperti esterni per approfondimenti culturali e scientifici sulla base dei quali, chi decide di partecipare al corso, dovrà creare un output.
    - Le microconferenze sono inconti in cui un insegnate o un esperto in materia, affianca i ragazzi in un percorso di scrittura di tipo quasi giornalistico e li prepara all'esposizione pubblica dell'output preparato.
  - - Il digital service in cosa consiste?
    - È un laboratorio dedicato alla formazione dei nostri studenti sulle competenze digitali, le modalità di comunicazione online e la gestione di contenuti multimediali. Gli alunni iscritti al questo corso inoltre organizzano delle esterne nei paesi limitrofi per fare formazione ai cittadini.
    - Il digital service consiste nella formazione dei nostri studenti in ambito delle competenze digitali e poi nella divulgazioni di quanto appreso nei comuni limitrofi, per offrire assistenza a chi ha difficoltà a familiarizzare con i dispositivi e i sistemi di accesso ai servizi.
  - - Ci sono attività sportive?
    - Sì, nella nostra scuola si svolgono diverse attività sportive tra cui corsi di atletica, orienteering, calcio a 5, pallavolo e attività motorie aggiuntive.
    - La nostra scuola offre varie attività sportive, potrai scegliere quale frequentare in base alle tue passioni e ai tuoi talenti. La scelta è ampia!
  - - Ci sono attività artistiche?
    - Sì, la nostra scuola offre diverse attività artistiche come ballo, teatro e laboratori creativi.
