categories:
  - corsi

conversations:
  - - Che corsi opzionali offre la scuola?
    - Sono disponibili digital service, romanae disputationes, micro conferenze, atletica, ballo, teatro e altri laboratori tematici.

  - - Posso ottenere certificazioni linguistiche?
    - Sì, la scuola offre preparazione alle certificazioni B1 e B2.

  - - È possibile conseguire certificazioni informatiche?
    - Sì, è disponibile la certificazione EIPASS.

  - - Cosa sono le micro conferenze?
    - Incontri brevi e tematici tenuti da docenti o esperti esterni per approfondimenti culturali e scientifici.

  - - Il digital service di cosa si occupa?
    - È un laboratorio dedicato a competenze digitali, comunicazione online e gestione di contenuti multimediali.

  - - Ci sono attività sportive?
    - Sì, tra cui corsi di atletica e attività motorie aggiuntive.

  - - Ci sono attività artistiche?
    - Sì, come ballo, teatro e laboratori creativi.
