categories:
  - corsi

conversations:
  - - Che corsi opzionali offre la scuola?
    - Sono disponibili corsi come il digital service, le romanae disputationes, le micro conferenze, i corsi di atletica, ballo, teatro e altri laboratori tematici.

  - - Posso ottenere certificazioni linguistiche?
    - Sì, la scuola offre preparazione alle certificazioni B1 e B2 ed è una sede d'esame dove puoi conseguire le certificazioni.

  - - È possibile conseguire certificazioni informatiche?
    - Sì, nella nostra scuola avrai la possibilità di conseguire la certificazione EIPASS.

  - - Cosa sono le micro conferenze?
    - Le microconferenze sono incontri brevi e tematici tenuti da docenti o esperti esterni per approfondimenti culturali e scientifici sulla base dei quali, chi decide di partecipare al corso, dovrà creare un output.

  - - Il digital service in cosa consiste?
    - È un laboratorio dedicato alla formazione dei nostri studenti sulle competenze digitali, le modalità di comunicazione online e la gestione di contenuti multimediali. Gli alunni iscritti al questo corso inoltre organizzano delle esterne nei paesi limitrofi per fare formazione ai cittadini.

  - - Ci sono attività sportive?
    - Sì, nella nostra scuola si svolgono diverse attività sportive tra cui corsi di atletica, orienteering, calcio a 5, pallavolo e attività motorie aggiuntive.

  - - Ci sono attività artistiche?
    - Sì, la nostra scuola offre diverse attività artistiche come ballo, teatro e laboratori creativi.
