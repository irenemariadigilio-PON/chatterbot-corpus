conversations:
  - - Qual è l’orario di apertura della segreteria?
    - La segreteria è aperta dalle 12:00 alle 13:15 in presenza ed è sempre disponibile telefonicamente per qualsiasi tipo di richiesta.
    - Gli ortari della nostra segreteria sono sempre visualizzabili sul nostro sito! La nostra segreteria riceve dalle 12:00 alle 13:15 in presenza ed è attiva e pronta a ricevere e rispondere a mail e telefonate durante tutto l'orario di apertura della scuola.
  - - Quando posso fare l’iscrizione online?
    - Le iscrizioni online si effettuano nel mese di Gennaio sul sito della nostra scuola.
    - Puoi effettuare la tua iscrizione online nel mese di Gennaio dal nostro sito!
  - - Quali documenti servono per l’iscrizione?
    - Documento d’identità e codice fiscale dell’alunno e dei genitori.
    - Per iscriverti alla nostra scuola sarà necessari documento di identità e codice fiscale sia dello studente che dei genitori.
  - - L’orario scolastico varia per indirizzo?
    - Sì, ogni indirizzo ha una distribuzione oraria specifica delle discipline, ma la struttura settimanale rimane simile.
    - In base a ogni indirizzo ci sono piani di studi differenti e di conseguenza anche monte ore differenti, per questo motivo l'orario può variare in base alla tua scelta. Tutto è illustrato nel quadro orario che puoi richiedere alla nostra segreteria o durante i nostri open-day!
  - - L’istituto dispone di sportello informativo?
    - Sì, presso la segreteria è attivo uno sportello di supporto alle famiglie.
    - La nostra scuola dispone di uno sportello attivo per dare assistenza alle famiglie sia fisico che online tramite le nostre info di contatto che puoi trovare sul nostro sito!
